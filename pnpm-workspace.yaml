packages:
  - apps/*
  - packages/*

overrides:
  '@nestjs/common': 11.1.18
  '@nestjs/core': 11.1.18
  '@nestjs/platform-express': 11.1.18
  deepmerge-ts: 8.0.0
  effect: 3.20.0
  fast-xml-parser: 5.7.0
  file-type: 21.3.2
  lodash: 4.18.1
  multer: 2.2.0
  nanoid: 3.3.18
  path-to-regexp: 8.4.0
  postcss: 8.5.23
  sharp: 0.35.0

allowBuilds:
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  # Optional native accelerator for msgpackr (pulled in by bullmq). We use the
  # pure-JS fallback and intentionally do not run its native build script.
  msgpackr-extract: false
  prisma: true
  sharp: true
  # O postinstall do tesseract.js é `opencollective-postinstall`, um aviso de
  # doação. Não compila nada e não é preciso para a leitura óptica funcionar.
  tesseract.js: false

onlyBuiltDependencies:
  - '@nestjs/core'
  - '@prisma/client'
  - '@prisma/engines'
  - esbuild
  - prisma
  - sharp
