packages:
  - apps/*
  - packages/*

allowBuilds:
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  # Optional native accelerator for msgpackr (pulled in by bullmq). We use the
  # pure-JS fallback and intentionally do not run its native build script.
  msgpackr-extract: false
  prisma: true
  sharp: true

onlyBuiltDependencies:
  - '@nestjs/core'
  - '@prisma/client'
  - '@prisma/engines'
  - esbuild
  - prisma
  - sharp
