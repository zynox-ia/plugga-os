packages:
  - apps/*
  - packages/*

overrides:
  brace-expansion@1: 1.1.20
  brace-expansion@2: 2.1.7
  '@nestjs/common': 11.1.18
  '@nestjs/core': 11.1.18
  '@nestjs/platform-express': 11.1.18
  deepmerge-ts: 8.0.0
  effect: 3.20.0
  fast-xml-parser: 5.7.2
  file-type: 21.3.2
  lodash: 4.18.1
  js-yaml: 4.3.2
  multer: 2.3.0
  nanoid: 3.3.18
  path-to-regexp: 8.4.0
  postcss: 8.5.23
  proxy-addr: 2.0.8
  source-map-js: 1.2.2
  sharp: 0.35.5

# braces (GHSA-vfj7-8cjw-p6xm, negação de serviço por padrões aninhados) não tem
# versão corrigida publicada (última: 3.0.3). Só chega por ferramentas de lint
# (typescript-eslint > fast-glob > micromatch), nunca processa entrada externa.
# Revisar quando sair >=3.0.4: remover esta exceção.
auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm

allowBuilds:
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  # Optional native accelerator for msgpackr (pulled in by bullmq). We use the
  # pure-JS fallback and intentionally do not run its native build script.
  msgpackr-extract: false
  prisma: true
  sharp: true
  # O postinstall do tesseract.js é `opencollective-postinstall`, um aviso de
  # doação. Não compila nada e não é preciso para a leitura óptica funcionar.
  tesseract.js: false

onlyBuiltDependencies:
  - '@nestjs/core'
  - '@prisma/client'
  - '@prisma/engines'
  - esbuild
  - prisma
  - sharp
