packages:
  - apps/*
  - packages/*

allowBuilds:
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  # Optional native accelerator for msgpackr (pulled in by bullmq). We use the
  # pure-JS fallback and intentionally do not run its native build script.
  msgpackr-extract: false
  prisma: true
  sharp: true
  # O postinstall do tesseract.js é `opencollective-postinstall`, um aviso de
  # doação. Não compila nada e não é preciso para a leitura óptica funcionar.
  tesseract.js: false

onlyBuiltDependencies:
  - '@nestjs/core'
  - '@prisma/client'
  - '@prisma/engines'
  - esbuild
  - prisma
  - sharp
