name: plugga-os

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-plugga_os}
      POSTGRES_USER: ${POSTGRES_USER:-plugga_os}
      # Local-only dummy default. Production credentials never belong here.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-56379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  # Object storage for the invoice files uploaded to the energy-efficiency
  # study. Speaks the S3 protocol, so the API talks to it with the AWS SDK and
  # swapping it for real S3 later is an environment change, not a code change.
  #
  # The image is pinned by digest, and not to `latest`: a blind bump could
  # change the S3 behaviour the API and the backup rely on. Replaces the MinIO
  # that ran here until 2026-09 (the community edition stopped receiving fixes).
  seaweedfs:
    image: chrislusf/seaweedfs@sha256:08d516132314207d10c8e37cbffc1f32b147d870169688734cc61c6231625b62
    command: ["mini", "-dir=/data", "-ip=0.0.0.0"]
    environment:
      # Local-only dummy defaults, same rule as Postgres above: production
      # credentials never belong in this file.
      AWS_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY:?set STORAGE_ACCESS_KEY in .env}
      AWS_SECRET_ACCESS_KEY: ${STORAGE_SECRET_KEY:?set STORAGE_SECRET_KEY in .env}
    ports:
      # S3 endpoint the API writes to.
      - "127.0.0.1:${STORAGE_PORT:-59000}:8333"
      # Painel de objetos: STORAGE_ADMIN_PORT do .env (59001 no stack local;
      # a baixa 9001 é o túnel para a produção — ops/GUIA.md).
      - "127.0.0.1:${STORAGE_ADMIN_PORT:-59001}:23646"
    volumes:
      - seaweedfs_data:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8333/status"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  # Creates the bucket once and exits. Without it the first upload fails on a
  # bucket that nobody remembered to create, which is a confusing way to learn
  # that storage is optional.
  seaweedfs-provisiona:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      seaweedfs:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set plugga http://seaweedfs:8333 \
          "${STORAGE_ACCESS_KEY:?set STORAGE_ACCESS_KEY in .env}" "${STORAGE_SECRET_KEY:?set STORAGE_SECRET_KEY in .env}"
        mc mb --ignore-existing plugga/plugga-comercial-clientes
        mc mb --ignore-existing plugga/plugga-energia-opm
        mc mb --ignore-existing plugga/plugga-produto-tecnologia
        mc mb --ignore-existing plugga/plugga-financeiro
        mc mb --ignore-existing plugga/waze-comercial-obras
        mc mb --ignore-existing plugga/waze-engenharia-obras
        mc mb --ignore-existing plugga/waze-financeiro
        mc mb --ignore-existing plugga/"${CORPUS_BUCKET:-plugga-corpus-faturas}"
        mc mb --ignore-existing plugga/plugga-backups
    restart: "no"

  # --- Application containers (profile "app") -------------------------------
  # Kept behind a profile so `docker compose up -d` still starts infrastructure
  # only, leaving ports 3000/3001 free for `pnpm dev`. The whole system is
  # `docker compose --profile app up -d`.
  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      # 0.0.0.0 inside the container is what makes it reachable from `web`; the
      # Compose network and the loopback-bound published port keep it private
      # (ADR-0012) — the bind is no longer the boundary.
      HOST: 0.0.0.0
      PORT: 3001
      # Service names, not localhost. Already inside the local-only allowlist,
      # so containerizing requires no guard to be loosened.
      # A aplicação conecta com papel restrito, que só faz DML. O dono do
      # banco (POSTGRES_USER) fica reservado para migration, e a credencial
      # dele não sai da VPS. Assim um comando destrutivo disparado pela
      # aplicação — ou por um ambiente de desenvolvimento apontado para cá —
      # falha por permissão em vez de apagar o banco.
      DATABASE_URL: postgresql://${APP_DB_USER:-plugga_app}:${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-plugga_os}?schema=public
      REDIS_URL: redis://redis:6379
      # `web` reaches the API over the Compose bridge, which is NOT loopback.
      # Left untrusted on purpose: web forwards no X-Forwarded-For unless
      # WEB_TRUST_PROXY is on, so req.ip is the web container and the /auth
      # throttle degrades to one shared bucket instead of becoming forgeable.
      # Raise both knobs together, and only behind a real reverse proxy.
      TRUST_PROXY: ${TRUST_PROXY:-loopback}
      # Not overridable from .env on purpose. The container runs the real,
      # production-shaped auth path; the x-dev-* header stub belongs to the
      # `pnpm dev` flow only, and NODE_ENV=production rejects it at boot anyway.
      DEV_AUTH_ENABLED: "false"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      AUTH_SESSION_SECRET: ${AUTH_SESSION_SECRET:?set AUTH_SESSION_SECRET in .env}
      AUTH_APP_BASE_URL: ${AUTH_APP_BASE_URL:-http://localhost:3000}
      AUTH_ALLOWED_ORIGINS: ${AUTH_ALLOWED_ORIGINS:-}
      # Login federado com o Google (adendo ao ADR-0008). Desligado por default:
      # é esta variável que faz o rollback do recurso, sem apagar vínculo nenhum.
      # O client id é público, mas é a audiência aceita no ID token — precisa ser
      # o MESMO do serviço `web`, ou o login recusa sem nada ter mudado no código.
      GOOGLE_AUTH_ENABLED: ${GOOGLE_AUTH_ENABLED:-false}
      GOOGLE_OIDC_CLIENT_ID: ${GOOGLE_OIDC_CLIENT_ID:-}
      GOOGLE_LOGIN_URI: ${GOOGLE_LOGIN_URI:-}
      # Present only while bootstrapping the first local administrator. Once the
      # seed has run, remove SEED_ADMIN_PASSWORD from .env and recreate `api` so
      # a later deliberate re-seed cannot reset an administrator password.
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@plugga.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      # Brevo é o único provedor em produção (2026-08-09). O default seguro
      # deixou de ser mailpit — o serviço foi removido — e passou a ser noop:
      # sem EMAIL_PROVIDER explícito, a API sobe sem conseguir enviar em vez de
      # apontar para um host que não existe mais.
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-noop}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-no-reply@plugga.local}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-plugga-os}
      # Sem valor padrão: a validação exige a chave quando o provedor é brevo
      # (apps/api/src/config/environment.ts), e um padrão vazio faria a API
      # recusar subir. Esta linha existia só no compose da VPS até 2026-08-11 —
      # é o que faz a chave do .env chegar ao contêiner, e sem ela a API de
      # produção, que roda com EMAIL_PROVIDER=brevo, não sobe.
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      JOBS_ENABLED: ${JOBS_ENABLED:-false}
      JOBS_WORKER_CONCURRENCY: ${JOBS_WORKER_CONCURRENCY:-1}
      # Where the uploaded invoice files are kept. Leaving STORAGE_ENDPOINT empty
      # disables storage without breaking anything: the invoice is still read
      # and the response just carries no file key. The endpoint is fixed, like
      # DATABASE_URL and REDIS_URL above: the .env carries the host-side address
      # (localhost:59000, for pnpm dev), and letting it leak into the container
      # would send every upload to the container's own loopback — storage would
      # fail silently on every invoice while the screen reports success.
      STORAGE_ENDPOINT: http://seaweedfs:8333
      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:?set STORAGE_ACCESS_KEY in .env}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:?set STORAGE_SECRET_KEY in .env}
      # Baked into the image at build time; see apps/api/Dockerfile. Pointing at
      # a local directory is what keeps the first scanned invoice from failing
      # on a CDN download in an environment with no outbound internet.
      TESSERACT_DATA_PATH: /app/tessdata
      # --- Chave de IA e o cofre que a guarda ---
      # A chave da OpenRouter é opcional aqui: o caminho normal é gravá-la pela
      # tela de Configurações, que guarda cifrada no banco. Esta variável serve
      # ao primeiro arranque e ao resgate, e o banco tem precedência sobre ela.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODELO: ${OPENROUTER_MODELO:-anthropic/claude-sonnet-4.5}
      OPENROUTER_APP_URL: ${OPENROUTER_APP_URL:-https://os.plugga.app.br}
      # Esta NÃO é opcional se a chave for guardada pela tela: sem ela o cofre
      # não cifra nem decifra, e a tela recusa gravar dizendo o que falta.
      # Gere com `openssl rand -base64 32` e não a rotacione sem regravar a
      # chave depois — o segredo antigo fica ilegível.
      SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY:-}
    ports:
      - "127.0.0.1:${API_PORT:-3001}:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      # Os baldes precisam existir antes do primeiro upload.
      seaweedfs-provisiona:
        condition: service_completed_successfully
    healthcheck:
      test:
        ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  web:
    profiles: ["app"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Inlined at build time; only reachable inside the Compose network.
        NEXT_PUBLIC_API_URL: http://api:3001
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://api:3001
      AUTH_ALLOWED_ORIGINS: ${AUTH_ALLOWED_ORIGINS:-}
      # Lidas em tempo de execução, não de build: a imagem standalone é a mesma
      # entre ambientes, e uma variável NEXT_PUBLIC_ ficaria congelada no bundle
      # com o valor de quem construiu. Os três valores têm de bater com os do
      # serviço `api` e com o que está cadastrado no Google Cloud.
      GOOGLE_AUTH_ENABLED: ${GOOGLE_AUTH_ENABLED:-false}
      GOOGLE_OIDC_CLIENT_ID: ${GOOGLE_OIDC_CLIENT_ID:-}
      GOOGLE_LOGIN_URI: ${GOOGLE_LOGIN_URI:-}
      # Off unless a reverse proxy in front of THIS app overwrites the header;
      # otherwise it is client-controlled and would defeat the API's throttle.
      WEB_TRUST_PROXY: ${WEB_TRUST_PROXY:-false}
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  seaweedfs_data:
