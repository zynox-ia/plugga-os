name: plugga-os-local-test

services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: plugga_os_test
      POSTGRES_USER: plugga_os_test
      POSTGRES_PASSWORD: local_test_only_change_me
    ports:
      - "127.0.0.1:55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plugga_os_test -d plugga_os_test"]
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data

  redis-test:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:56380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  seaweedfs-test:
    image: chrislusf/seaweedfs@sha256:08d516132314207d10c8e37cbffc1f32b147d870169688734cc61c6231625b62
    command: ["mini", "-dir=/data", "-ip=0.0.0.0"]
    environment:
      AWS_ACCESS_KEY_ID: plugga_os_test
      AWS_SECRET_ACCESS_KEY: local_test_storage_only_change_me
      S3_BUCKET: plugga-faturas-test
    ports:
      - "127.0.0.1:59002:8333"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8333/status"]
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /data

  seaweedfs-test-provision:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      seaweedfs-test:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set plugga-test http://seaweedfs-test:8333 \
          "plugga_os_test" "local_test_storage_only_change_me"
        mc mb --ignore-existing plugga-test/plugga-faturas-test
    restart: "no"
