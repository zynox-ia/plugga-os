name: plugga-os-local-test

services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: plugga_os_test
      POSTGRES_USER: plugga_os_test
      POSTGRES_PASSWORD: local_test_only_change_me
    ports:
      - "127.0.0.1:55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plugga_os_test -d plugga_os_test"]
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data

  redis-test:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:56380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  rustfs-test:
    image: rustfs/rustfs@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff
    environment:
      RUSTFS_ACCESS_KEY: plugga_os_test
      RUSTFS_SECRET_KEY: local_test_storage_only_change_me
      RUSTFS_CONSOLE_ENABLE: "false"
    ports:
      - "127.0.0.1:59002:9000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/health/ready"]
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /data:uid=10001,gid=10001

  rustfs-test-provision:
    image: plugga-os-api:latest
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      rustfs-test:
        condition: service_healthy
    environment:
      STORAGE_ENDPOINT: http://rustfs-test:9000
      STORAGE_ACCESS_KEY: plugga_os_test
      STORAGE_SECRET_KEY: local_test_storage_only_change_me
      STORAGE_BUCKET: plugga-arquivos
      STORAGE_LEGACY_BUCKETS: plugga-comercial-clientes,plugga-energia-opm,plugga-produto-tecnologia,plugga-suprimentos,plugga-financeiro,plugga-marketing,waze-comercial-obras,waze-engenharia-obras,waze-suprimentos,waze-financeiro,waze-marketing
    volumes:
      - ./apps/api/scripts/provisionar-storage.mjs:/app/apps/api/scripts/provisionar-storage.mjs:ro
    command: ["node", "scripts/provisionar-storage.mjs"]
    restart: "no"
