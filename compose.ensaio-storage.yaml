# Ensaio dos scripts de armazenamento (ops/prepara-backup.test.sh e
# ops/prepara-corpus.test.sh).
#
# Sobe um SeaweedFS descartável, sem porta publicada e sem volume nomeado: nada aqui
# encosta no ambiente de desenvolvimento nem em produção. A senha nunca fica escrita
# aqui: os scripts de ensaio geram uma nova a cada execução e a passam em
# ENSAIO_SEGREDO (é isso também que mantém o scanner de segredos da CI calado, sem
# lista de exceções).
name: ensaio-storage

services:
  seaweedfs:
    # Mesma imagem e mesmo modo do compose.yaml de produção.
    image: chrislusf/seaweedfs@sha256:08d516132314207d10c8e37cbffc1f32b147d870169688734cc61c6231625b62
    command: ["mini", "-dir=/data", "-ip=0.0.0.0"]
    environment:
      AWS_ACCESS_KEY_ID: ensaio
      AWS_SECRET_ACCESS_KEY: ${ENSAIO_SEGREDO:?defina ENSAIO_SEGREDO (os scripts de ensaio fazem isso)}

  # Só o cliente `mc`, usado como ferramenta de linha de comando S3.
  mc:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on: [seaweedfs]
    environment:
      MC_HOST_dest: http://ensaio:${ENSAIO_SEGREDO:?defina ENSAIO_SEGREDO}@seaweedfs:8333
    entrypoint: ["sleep", "3600"]
