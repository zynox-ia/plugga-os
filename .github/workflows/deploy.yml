name: Deploy

# Dispara quando o workflow CI termina na main — não no push direto. Deploy
# sem o portão de lint/typecheck/test/build/e2e passar seria a mesma classe de
# problema que o ops/deploy.sh já resolve do lado do banco (migrar antes de
# subir, na ordem certa): aqui a ordem que importa é código verificado antes
# de publicado.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    name: Deploy to plugga-vps
    runs-on: [self-hosted, plugga-vps]
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout do commit que passou na CI
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Sincronizar para /opt/plugga-os
        run: |
          # Só o .env fica de fora: ele carrega segredo real, que por desenho
          # não vive no repositório. O compose.yaml era excluído pela mesma
          # justificativa, mas ela não valia — o arquivo é inteiramente
          # parametrizado por ${VAR} do .env, sem um único valor de produção.
          # Excluí-lo deixava a cópia da VPS envelhecer à mão, e em 2026-08-10
          # isso custou o cofre sem SECRETS_ENCRYPTION_KEY e quase custou o
          # login com Google. .git fica de fora porque /opt/plugga-os não é um
          # clone.
          # Os .bak-* são a cópia de segurança de quem já precisou mexer no
          # compose da VPS à mão. O --delete os apagava a cada publicação —
          # excluí-los preserva de onde voltar se uma publicação levar um
          # compose ruim.
          sudo rsync -a --delete \
            --exclude='.git' --exclude='node_modules' \
            --exclude='.env' --exclude='compose.yaml.bak-*' \
            ./ /opt/plugga-os/
          sudo chown -R root:root /opt/plugga-os
          sudo chmod 600 /opt/plugga-os/.env
          sudo chmod +x /opt/plugga-os/ops/deploy.sh

      - name: Publicar
        run: sudo /opt/plugga-os/ops/deploy.sh
