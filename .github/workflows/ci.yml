name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://plugga_os:local_only_change_me@localhost:55432/plugga_os?schema=public
      REDIS_URL: redis://localhost:6379
      # Local CI-only dummy values (not secrets); auth boot/seed require them.
      AUTH_SESSION_SECRET: ci_local_only_session_secret_change_me_please
      SEED_ADMIN_PASSWORD: ci_local_only_change_me

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: plugga_os
          POSTGRES_USER: plugga_os
          POSTGRES_PASSWORD: local_only_change_me
        ports:
          # 55432 e nao 5432: e a mesma convencao do stack local. Na maquina de
          # quem desenvolve a 5432 e um tunel para o Postgres de producao, e o
          # guarda-corpo do Prisma recusa escrever nela. Manter a CI na mesma
          # porta faz a regra nao ter excecao — e excecao em regra de seguranca
          # e por onde ela deixa de valer.
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U plugga_os -d plugga_os"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable the pinned pnpm version
        run: |
          corepack enable
          corepack install

      - name: Install dependencies from the lockfile
        run: pnpm install --frozen-lockfile

      - name: Scan repository for secrets
        run: >-
          docker run --rm
          --volume "$PWD:/repo"
          zricethezav/gitleaks:v8.28.0
          detect --source=/repo --redact --verbose

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Apply database migrations
        run: pnpm db:migrate:deploy

      - name: Seed local foundation data
        run: pnpm db:seed

      - name: Verify append-only database triggers
        run: pnpm test:db

      - name: Verify BullMQ jobs foundation
        env:
          RUN_JOBS_INTEGRATION_TESTS: "true"
          JOBS_ENABLED: "true"
        run: pnpm --filter @plugga/api test:jobs

      - name: Verify Bitrix mirror idempotency
        run: pnpm --filter @plugga/api test:bitrix

      - name: Verify seed preserves cutover and access state
        run: pnpm --filter @plugga/api test:seed

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:3001
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm --filter @plugga/web exec playwright install --with-deps chromium

      - name: Start API for web e2e
        env:
          DATABASE_URL: postgresql://plugga_os:local_only_change_me@localhost:55432/plugga_os?schema=public
          DEV_AUTH_ENABLED: "true"
          AUTH_SESSION_SECRET: ci_local_only_session_secret_change_me_please
          HOST: 127.0.0.1
          PORT: "3001"
          NODE_ENV: development
          # Login Google LIGADO com um client id de mentira. Nenhum teste chama
          # o Google — o que isto prova é que a API sobe com a configuração
          # ligada, que é o arranjo de produção depois do rollout. Sem isto, a
          # única forma de descobrir que a flag derruba o boot seria em produção.
          GOOGLE_AUTH_ENABLED: "true"
          GOOGLE_OIDC_CLIENT_ID: ci-only.apps.googleusercontent.com
          GOOGLE_LOGIN_URI: http://127.0.0.1:3000/api/auth/google/callback
          # Sem provedor a API cai no noop, o mesmo default de produção desde
          # que Brevo passou a ser o único provedor real (2026-08-09) e o
          # Mailpit saiu de cena (2026-08-10). Os e2e de convite/reset que
          # liam o token de um e-mail foram removidos junto — sem adaptador
          # que efetivamente entregue localmente, não há onde ler o token.
        run: |
          pnpm --filter @plugga/api start &
          echo $! > /tmp/plugga-api.pid
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3001/health >/dev/null; then
              echo "API ready"
              exit 0
            fi
            sleep 1
          done
          echo "API failed to become ready"
          exit 1

      - name: Playwright e2e (web against live API)
        id: playwright
        env:
          CI: "true"
          NEXT_PUBLIC_API_URL: http://127.0.0.1:3001
        run: pnpm test:e2e

      - name: Upload Playwright failure artifacts
        if: ${{ failure() && steps.playwright.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-${{ github.run_attempt }}
          path: apps/web/test-results
          if-no-files-found: warn
          retention-days: 14

      - name: Stop API
        if: always()
        run: |
          if [ -f /tmp/plugga-api.pid ]; then
            kill "$(cat /tmp/plugga-api.pid)" || true
          fi
