name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://plugga_os:local_only_change_me@localhost:5432/plugga_os?schema=public
      REDIS_URL: redis://localhost:6379
      # Local CI-only dummy values (not secrets); auth boot/seed require them.
      AUTH_SESSION_SECRET: ci_local_only_session_secret_change_me_please
      SEED_ADMIN_PASSWORD: ci_local_only_change_me

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: plugga_os
          POSTGRES_USER: plugga_os
          POSTGRES_PASSWORD: local_only_change_me
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U plugga_os -d plugga_os"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      mailpit:
        image: axllent/mailpit:v1.21
        ports:
          - 1025:1025
          - 8025:8025

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable the pinned pnpm version
        run: |
          corepack enable
          corepack install

      - name: Install dependencies from the lockfile
        run: pnpm install --frozen-lockfile

      - name: Scan repository for secrets
        run: >-
          docker run --rm
          --volume "$PWD:/repo"
          zricethezav/gitleaks:v8.28.0
          detect --source=/repo --redact --verbose

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Apply database migrations
        run: pnpm db:migrate:deploy

      - name: Seed local foundation data
        run: pnpm db:seed

      - name: Verify append-only database triggers
        run: pnpm test:db

      - name: Verify Mailpit email delivery path
        env:
          MAILPIT_SMTP_HOST: localhost
          MAILPIT_SMTP_PORT: "1025"
          MAILPIT_UI_PORT: "8025"
        run: pnpm --filter @plugga/api test:email

      - name: Verify BullMQ jobs foundation
        env:
          RUN_JOBS_INTEGRATION_TESTS: "true"
          JOBS_ENABLED: "true"
        run: pnpm --filter @plugga/api test:jobs

      - name: Verify Bitrix mirror idempotency
        run: pnpm --filter @plugga/api test:bitrix

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:3001
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm --filter @plugga/web exec playwright install --with-deps chromium

      - name: Start API for web e2e
        env:
          DATABASE_URL: postgresql://plugga_os:local_only_change_me@localhost:5432/plugga_os?schema=public
          DEV_AUTH_ENABLED: "true"
          AUTH_SESSION_SECRET: ci_local_only_session_secret_change_me_please
          HOST: 127.0.0.1
          PORT: "3001"
          NODE_ENV: development
        run: |
          pnpm --filter @plugga/api start &
          echo $! > /tmp/plugga-api.pid
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3001/health >/dev/null; then
              echo "API ready"
              exit 0
            fi
            sleep 1
          done
          echo "API failed to become ready"
          exit 1

      - name: Playwright e2e (web against live API)
        env:
          CI: "true"
          NEXT_PUBLIC_API_URL: http://127.0.0.1:3001
        run: pnpm test:e2e

      - name: Stop API
        if: always()
        run: |
          if [ -f /tmp/plugga-api.pid ]; then
            kill "$(cat /tmp/plugga-api.pid)" || true
          fi

